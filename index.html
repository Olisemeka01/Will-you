<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Will You Be My Girlfriend? 💜</title>
  <style>
  @layer base {
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    body {
      overscroll-behavior: none;
    }
    main > :first-child {
      margin-top: 0 !important;
    }
    main > :last-child {
      margin-bottom: 0 !important;
    }
  }

  /* Custom scrollbar styling */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #fff8f4;
  }
  ::-webkit-scrollbar-thumb {
    background: #9e00b5;
    border-radius: 4px;
  }

  /* Updated border stripes: Red stripe, Cream space, Purple stripe, Cream space */
  /* Using 40px widths for a chunky, distinct envelope feel as per reference image */
  .envelope-border {
    background: repeating-linear-gradient(
      45deg,
      #b61722, #b61722 40px,
      #fff8f4 40px, #fff8f4 80px,
      #9e00b5 80px, #9e00b5 120px,
      #fff8f4 120px, #fff8f4 160px
    );
  }

  /* Fixed scalloped mask to ensure solid background for text visibility */
  .scalloped-mask {
    mask-image: radial-gradient(circle at 12px 12px, transparent 12px, black 12.5px);
    mask-size: 24px 24px;
    mask-repeat: repeat;
    background-color: #ffffff;
  }

  /* Accessibility: Better focus states */
  *:focus-visible {
    outline: 3px solid #9e00b5;
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* Skip link for keyboard users */
  .skip-link {
    position: absolute;
    top: -40px;
    left: 0;
    background: #9e00b5;
    color: white;
    padding: 8px;
    z-index: 100;
    transition: top 0.3s;
  }
  .skip-link:focus {
    top: 0;
  }

  /* Reduced motion support */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .animate-ping,
    .animate-pulse {
      animation: none !important;
    }
  }

  /* Smooth transitions for transform only */
  .smooth-transform {
    transition: transform 0.3s ease-out, opacity 0.3s ease-out;
  }
  </style>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
  tailwind.config = {
    theme: {
      extend: {
        "colors": {
          "on-secondary-fixed": "#410004",
          "surface-container-highest": "#f4dfcd",
          "on-tertiary-fixed-variant": "#5516be",
          "secondary-container": "#da3437",
          "inverse-surface": "#3a2e22",
          "on-error-container": "#93000a",
          "on-tertiary": "#ffffff",
          "surface-variant": "#f4dfcd",
          "surface-tint": "#a200ba",
          "primary": "#9e00b5",
          "on-primary-fixed-variant": "#7c008e",
          "tertiary-container": "#8455ef",
          "surface": "#fff8f4",
          "on-background": "#241a0f",
          "secondary-fixed-dim": "#ffb3ad",
          "secondary": "#b61722",
          "outline-variant": "#d6c0d3",
          "error-container": "#ffdad6",
          "on-error": "#ffffff",
          "tertiary": "#6b38d4",
          "tertiary-fixed-dim": "#d0bcff",
          "surface-container-lowest": "#ffffff",
          "secondary-fixed": "#ffdad7",
          "on-primary-fixed": "#36003e",
          "on-tertiary-fixed": "#23005c",
          "error": "#ba1a1a",
          "on-primary-container": "#fffbff",
          "surface-container-low": "#fff1e7",
          "surface-bright": "#fff8f4",
          "tertiary-fixed": "#e9ddff",
          "on-surface": "#241a0f",
          "outline": "#847183",
          "on-secondary-container": "#fffbff",
          "on-secondary": "#ffffff",
          "surface-container-high": "#f9e5d3",
          "on-surface-variant": "#524251",
          "on-primary": "#ffffff",
          "surface-dim": "#ebd6c5",
          "primary-container": "#c028d7",
          "primary-fixed": "#ffd6fd",
          "surface-container": "#ffead9",
          "inverse-on-surface": "#ffeee0",
          "background": "#fff8f4",
          "on-tertiary-container": "#fffbff",
          "primary-fixed-dim": "#fbabff",

          "on-secondary-fixed-variant": "#930013"

        "borderRadius": {
          "DEFAULT": "1rem",

          "section-gap": "4rem",
          "unit": "8px",
          "gutter": "1.5rem",

        },
        "fontFamily": {
          "body-md": ["Plus Jakarta Sans"],
          "display-romantic": ["Great Vibes", "cursive"],
          "display-bold": ["Bricolage Grotesque"],
          "headline-lg": ["Bricolage Grotesque"],

          "headline-lg-mobile": ["Bricolage Grotesque"]

        "fontSize": {
          "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "600"}],
          "display-romantic": ["56px", {"lineHeight": "1.1", "letterSpacing": "0.02em", "fontWeight": "400"}],
          "display-bold": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
          "headline-lg": ["36px", {"lineHeight": "1.2", "fontWeight": "800"}],
          "label-sm": ["16px", {"lineHeight": "1.1", "fontWeight": "800"}],
          "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "800"}]
        }
      }
    }
  }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Bricolage+Grotesque:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&family=Sacramento&display=swap" rel="stylesheet">

<body class="bg-surface font-body-md text-on-surface min-h-screen relative overflow-hidden flex flex-col items-center justify-center" style="background-color: var(--secondary-fixed);">
  <!-- Skip Link for Accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Outer Envelope Border -->
  <div class="fixed inset-0 z-0 envelope-border" aria-hidden="true"></div>

  <!-- Main White Inset Container -->
  <div class="fixed inset-2 sm:inset-4 z-10 bg-surface rounded-lg overflow-hidden flex flex-col items-center justify-center">

  <main id="main-content" class="relative z-20 w-full max-w-4xl mx-auto px-gutter py-card-padding">
  <div class="flex flex-col w-full relative">
    <!-- Interactive Background Layer -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" id="heart-container" aria-hidden="true"></div>

    <div class="relative z-10 w-full flex flex-col items-center justify-center py-section-gap">
      <!-- Main Proposal Card -->
      <div class="relative bg-white shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] w-full max-w-lg p-card-padding rounded-lg smooth-transform" id="proposal-card" role="region" aria-label="Valentine's proposal card">
        <!-- Red Ribbon Corner -->
        <div class="absolute -top-2 -right-2 w-24 h-24 overflow-hidden rounded-tr-lg pointer-events-none" aria-hidden="true">
          <div class="absolute top-4 -right-8 w-32 h-8 bg-secondary rotate-45 flex items-center justify-center shadow-md">
            <div class="w-full h-1 bg-white/20"></div>
          </div>
        </div>

        <!-- Content -->
        <div class="flex flex-col items-center text-center space-y-8 relative z-30">
          <div class="relative">
            <span class="material-symbols-outlined text-primary text-6xl opacity-10 absolute -top-8 -left-8 -rotate-12" aria-hidden="true">favorite</span>
            <h1 class="font-display-romantic text-display-romantic text-primary drop-shadow-sm py-2 text-wrap-balance">
              Will You Be My Girlfriend? 💜
            </h1>
          </div>
          <p class="font-body-md text-on-surface text-lg max-w-sm leading-relaxed font-bold">
            Every moment with you makes my world brighter. I'd love to make more memories together. ❤️
          </p>

          <!-- Main CTAs -->
          <div class="flex flex-col sm:flex-row items-center justify-center gap-6 pt-4 w-full min-h-[140px]">
            <button
              class="group relative px-14 py-5 bg-gradient-to-r from-primary to-tertiary text-on-primary font-headline-lg rounded-full shadow-lg transition-transform duration-300 hover:scale-110 active:scale-95 flex items-center gap-3 focus-visible:ring-4 focus-visible:ring-primary/30"
              id="btn-yes"
              aria-label="Yes, I will be your girlfriend"
            >
              <span class="material-symbols-outlined transition-transform group-hover:scale-125 group-hover:rotate-12" style="font-variation-settings: 'FILL' 1;" aria-hidden="true">favorite</span>
              <span>Yes</span>
            </button>
            <button
              class="px-8 py-3 bg-surface-container-highest text-on-surface-variant font-headline-lg rounded-full shadow smooth-transform hover:bg-error-container hover:text-on-error-container focus-visible:ring-4 focus-visible:ring-secondary/30"
              id="btn-no"
              aria-label="No, I'm not sure"
            >
              No
            </button>
          </div>
        </div>

        <!-- Gift Boxes Decoration -->
        <div class="absolute -bottom-10 -left-10 w-20 h-20 opacity-100 smooth-transform hover:scale-110 duration-500" aria-hidden="true">
          <svg class="w-full h-full text-primary drop-shadow-md" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 12v10H4V12"></path>
            <path d="M2 7h20v5H2z"></path>
            <path d="M12 22V7"></path>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </div>
        <div class="absolute -bottom-6 -right-8 w-16 h-16 opacity-100 smooth-transform hover:scale-110 duration-500 delay-75" aria-hidden="true">
          <svg class="w-full h-full text-secondary drop-shadow-md" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 12v10H4V12"></path>
            <path d="M2 7h20v5H2z"></path>
            <path d="M12 22V7"></path>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </div>
      </div>

      <!-- Success Modal -->
      <div
        class="fixed inset-0 z-50 flex items-center justify-center p-gutter smooth-transform opacity-0 translate-y-10 pointer-events-none"
        id="success-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="success-title"
        aria-describedby="success-message"
      >
        <div class="bg-white shadow-[0_30px_60px_-15px_rgba(158,0,181,0.3)] rounded-xl w-full max-w-md overflow-hidden relative border-4 border-primary/20">
          <div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-secondary/5" aria-hidden="true"></div>
          <div class="relative p-card-padding flex flex-col items-center text-center space-y-6">
            <div class="w-32 h-32 relative flex items-center justify-center">
              <div class="absolute inset-0 bg-primary/20 rounded-full animate-ping" aria-hidden="true"></div>
              <span class="material-symbols-outlined text-secondary text-8xl animate-pulse" style="font-variation-settings: 'FILL' 1;" aria-hidden="true">favorite</span>
            </div>
            <div class="space-y-4">
              <h2 id="success-title" class="font-display-romantic text-headline-lg text-primary text-4xl">Yay!! ❤️</h2>
              <p id="success-message" class="font-body-md text-on-surface text-lg font-bold">You just made me the happiest person alive! I promise to make every day special with you. 💕</p>
            </div>
            <button
              class="mt-4 px-10 py-4 bg-primary text-on-primary rounded-full font-headline-lg shadow-lg hover:bg-tertiary transition-colors focus-visible:ring-4 focus-visible:ring-primary/30"
              id="btn-celebrate"
              aria-label="Celebrate with more confetti"
            >
              Celebrate! 🎉
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  </main>

  <div class="absolute -bottom-12 -right-12 w-24 h-24 bg-secondary/10 rounded-full blur-3xl" aria-hidden="true"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
      (function() {
        // Check for reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const btnCelebrate = document.getElementById('btn-celebrate');
        const successModal = document.getElementById('success-modal');
        const proposalCard = document.getElementById('proposal-card');
        const heartContainer = document.getElementById('heart-container');

        let noClickCount = 0;
        const noLabels = ["No", "Are you sure?", "Really?", "Think again 🥺", "Pretty please?", "My heart... 😭"];
        let yesScale = 1;

        // Floating Hearts Background
        function createHeart() {
          if (prefersReducedMotion) return;

          const heart = document.createElement('div');
          heart.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">favorite</span>';
          heart.className = 'absolute text-secondary/30 pointer-events-none';
          heart.setAttribute('aria-hidden', 'true');

          const size = Math.random() * 20 + 15;
          const startX = Math.random() * 100;
          const duration = Math.random() * 10 + 5;

          heart.style.fontSize = `${size}px`;
          heart.style.left = `${startX}%`;
          heart.style.bottom = `-10%`;
          heart.style.transition = `all ${duration}s linear`;
          heart.style.opacity = Math.random() * 0.4 + 0.2;

          heartContainer.appendChild(heart);

          setTimeout(() => {
            heart.style.bottom = `110%`;
            heart.style.transform = `translateX(${(Math.random() - 0.5) * 150}px) rotate(${Math.random() * 360}deg)`;
          }, 50);

          setTimeout(() => heart.remove(), duration * 1000);
        }

        // Only start heart animation if not reduced motion
        if (!prefersReducedMotion) {
          setInterval(createHeart, 600);
        }

        // No Button Logic
        btnNo.addEventListener('click', () => {
          noClickCount++;

          if (noClickCount >= noLabels.length) {
            btnNo.style.opacity = '0';
            btnNo.style.transform = 'scale(0)';
            btnNo.setAttribute('aria-label', 'Option removed');
            setTimeout(() => btnNo.remove(), 300);
          } else {
            const randomX = (Math.random() - 0.5) * 250;
            const randomY = (Math.random() - 0.5) * 250;

            btnNo.style.transform = `translate(${randomX}px, ${randomY}px) scale(${1 - (noClickCount * 0.15)})`;
            btnNo.textContent = noLabels[noClickCount];
            btnNo.setAttribute('aria-label', `Option: ${noLabels[noClickCount]}`);
          }

          // Grow Yes Button
          yesScale += 0.3;
          btnYes.style.transform = `scale(${yesScale})`;
          btnYes.style.boxShadow = `0 0 ${20 + (noClickCount * 15)}px rgba(158,0,181,${0.3 + (noClickCount * 0.1)})`;
        });

        // Yes Button Logic
        btnYes.addEventListener('click', () => {
          document.body.style.backgroundColor = 'var(--secondary-fixed)';

          if (!prefersReducedMotion) {
            confetti({
              particleCount: 200,
              spread: 80,
              origin: { y: 0.6 },
              colors: ['#9e00b5', '#b61722', '#6b38d4']
            });

            // Stagger the hearts for a more polished effect
            for(let i = 0; i < 40; i++) {
              setTimeout(createHeart, i * 40);
            }
          }

          proposalCard.classList.add('opacity-0', 'scale-90', 'pointer-events-none');

          setTimeout(() => {
            successModal.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
            successModal.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
            // Focus management: move focus to modal
            btnCelebrate.focus();
          }, 500);
        });

        // Celebrate Button Logic
        btnCelebrate.addEventListener('click', () => {
          if (prefersReducedMotion) return;

          const end = Date.now() + 5 * 1000;
          const colors = ['#9e00b5', '#b61722', '#ffd6fd'];

          (function frame() {
            confetti({
              particleCount: 3,
              angle: 60,
              spread: 60,
              origin: { x: 0 },
              colors: colors
            });
            confetti({
              particleCount: 3,
              angle: 120,
              spread: 60,
              origin: { x: 1 },
              colors: colors
            });

            if (Date.now() < end) {
              requestAnimationFrame(frame);
            }
          }());
        });

        // Keyboard Navigation: Close modal with Escape
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && successModal.classList.contains('opacity-100')) {
            successModal.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
            successModal.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
            btnYes.focus();
          }
        });

        // Keyboard Navigation: Allow activating buttons with Space
        btnNo.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            btnNo.click();
          }
        });

        btnYes.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            btnYes.click();
          }
        });

        btnCelebrate.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            btnCelebrate.click();
          }
        });
      })();
    </script>
</body>
</html>
